<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Register</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .auth-wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f6fb;
        }

        .auth-card {
            background: white;
            width: 360px;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1e3a8a;
        }

        .auth-card label {
            font-weight: 600;
            display: block;
            margin-top: 12px;
        }

        .auth-card input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .auth-card button {
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .auth-card p {
            text-align: center;
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>📝 Register</h2>

        <label>Email</label>
        <input type="email" id="email">

        <label>Password</label>
        <input type="password" id="password">

        <button onclick="register()">Register</button>

        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/register.js"></script>
</body>
</html>
