<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bills</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<header class="top-bar">
    <h2>🧾 Bills & Reminders</h2>
    <button onclick="goBack()" class="logout-btn">Back</button>
</header>

<section class="grid">

    <!-- ===================== -->
    <!-- ADD BILL -->
    <!-- ===================== -->
    <div class="box">
        <h3>➕ Add Bill</h3>

        <label>Bill Name</label>
        <input type="text" id="billName" placeholder="Electricity / Rent" required>

        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="Enter amount" required>

        <label>Due Date</label>
        <input type="date" id="dueDate" required>

        <button onclick="createBill()">Add Bill</button>

        <p id="msg"></p>
    </div>

    <!-- ===================== -->
    <!-- BILL LIST -->
    <!-- ===================== -->
    <div class="box">
        <h3>📋 My Bills</h3>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="bill-table">
                <!-- Bills inserted dynamically -->
            </tbody>
        </table>
    </div>

</section>

<!-- ===================== -->
<!-- SCRIPTS -->
<!-- ===================== -->
<script src="js/config.js"></script>
<script src="js/bills.js"></script>

<script>
function goBack() {
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
