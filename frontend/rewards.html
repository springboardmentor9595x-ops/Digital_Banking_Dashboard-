<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rewards Dashboard</title>
<link rel="stylesheet" href="css/rewards.css">
</head>

<body>

<div class="rewards-container">

    <!-- ===== HEADER ===== -->
    <div class="page-header">
        <div class="header-left">
            <h2>🎁 Rewards</h2>
        </div>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">
            Back
        </button>
    </div>
    <!-- ===== TOP CONTROLS ===== -->
    <div class="rewards-top-controls">

        <div class="left-controls">
            <select id="currencySelector">
                <option value="INR">INR</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>

            <button onclick="loadRewards()" class="refresh-btn">
                Refresh
            </button>
        </div>

        <div class="right-controls">
            <input type="text" id="programName" placeholder="Program Name">
            <input type="number" id="pointsInput" placeholder="Points">
            <input type="number" id="valuePerPoint" placeholder="Value per Point">

            <select id="addCurrency">
                <option value="INR">INR</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>

            <button onclick="addRewardProgram()" class="add-btn">
                Add
            </button>
        </div>

    </div>

    <!-- ===== SUMMARY CARDS ===== -->
    <div class="summary-grid">

        <div class="summary-card">
            <p>Total Points</p>
            <h3 id="totalPointsDisplay">0</h3>
        </div>

        <div class="summary-card primary">
            <p>Total Reward Value</p>
            <h3 id="currencySummary">₹ 0</h3>
        </div>
        <!-- ===== TIER PROGRESS ===== -->
        <div class="tier-section">
            <div class="tier-left">
                <h4 id="tierLabel">Silver Member</h4>
                <div class="tier-progress-bar">
                    <div id="tierProgressFill"></div>
                </div>
                <small id="tierProgressText">Progress to Gold</small>
            </div>

            <div class="stats-strip">
                <div class="stat-box">
                    <p>Active Programs</p>
                    <h3 id="activePrograms">0</h3>
                </div>
                <div class="stat-box">
                    <p>High Value Program</p>
                    <h3 id="topProgram">-</h3>
                </div>
                <div class="stat-box">
                    <p>Performance</p>
                    <h3 id="performanceBadge">⭐ Good</h3>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== REWARD PROGRAMS GRID ===== -->
    <div id="rewardsGrid" class="rewards-grid">
        <!-- Injected by JS -->
    </div>

</div>

<script src="js/rewards.js"></script>
</body>
</html>
