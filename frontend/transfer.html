<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transfer Money</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        /* ================= ADD TRANSACTION BUTTON STYLE ================= */

        .add-btn {
            background-color: #ef4444;   /* Same red as Back button */
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .add-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>

<!-- ================= TOP BAR ================= -->
<header class="top-bar" style="display:flex; justify-content:space-between; align-items:flex-start;">
    <h2>💸 Transfer Money</h2>

    <div style="display:flex; flex-direction:column; gap:8px;">
        <button onclick="goBack()" class="logout-btn">Back</button>
        <button onclick="toggleAddTransaction()" class="add-btn">➕ Add Transaction</button>
    </div>
</header>

<!-- ================= ADD TRANSACTION ================= -->
<!-- ================= ADD TRANSACTION ================= -->
<section id="add-transaction-section" style="display:none;">
    <div class="box" style="max-width:420px; margin:20px auto;">
        <h3>Add Transaction</h3>

        <!-- FROM ACCOUNT -->
        <label>From Account</label>
        <select id="from-account"></select>

        <!-- AMOUNT -->
        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="Enter amount">

        <!-- MERCHANT (RENAMED FROM DESCRIPTION) -->
        <label>Merchant</label>
        <input type="text" id="merchant" placeholder="e.g. Zomato, Myntra">

        <!-- CATEGORY -->
        <label>Category</label>
        <select id="category">
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Others">Others</option>
        </select>
        <label>Transaction Date</label>
        <input type="date" id="transaction-date">

        <button type="button" class="add-btn" onclick="submitTransaction()">
            Submit Transaction
        </button>
    </div>
</section>

<!-- ================= TRANSFER DETAILS ================= -->
<section class="grid single">
    <div class="box" style="max-width:420px; margin:auto;">
        <h3>Transfer Details</h3>

        <label>From Bank</label>
        <select id="from-bank">
            <option value="HDFC">HDFC Bank</option>
            <option value="SBI">SBI Bank</option>
            <option value="AXIS">AXIS Bank</option>
            <option value="PNB">PNB Bank</option>
        </select>

        <label>From Account ID</label>
        <input type="number" id="from-account-id" placeholder="Enter account ID">

        <label>To Bank</label>
        <select id="to-bank">
            <option value="HDFC">HDFC Bank</option>
            <option value="SBI">SBI Bank</option>
            <option value="AXIS">AXIS Bank</option>
            <option value="PNB">PNB Bank</option>
        </select>

        <label>To Account ID</label>
        <input type="number" id="to-account-id" placeholder="Enter account ID">

        <label>Amount (₹)</label>
        <input type="number" id="transfer-amount" placeholder="Enter amount">

        <!-- 🔒 LOCKED TRANSFER BUTTON (INTENTIONAL) -->
        <button type="button" class="add-btn" onclick="handleTransfer()">
            Transfer
        </button>

    </div>
</section>

<!-- ================= SCRIPTS ================= -->
<script src="js/config.js"></script>
<script src="js/transfer.js"></script>

<script>
function goBack() {
    window.location.href = "dashboard.html";
}

function toggleAddTransaction() {
    const section = document.getElementById("add-transaction-section");
    section.style.display =
        section.style.display === "none" ? "block" : "none";
}
</script>

</body>
</html>
